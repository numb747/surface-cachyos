# ============================================================================
#  iptsd 配置补充 —— 装到 /etc/iptsd.d/10-surface-cachyos.conf
#  配合"粘滞极大值"补丁使用（setup/03-iptsd-patched.sh，原理见 docs/08）
#
#  ■ 为什么要改 DeactivationThreshold
#      补丁让"已经在的触点"只需峰值 > DeactivationThreshold 就保持住。
#      iptsd 3.1.0 的真实默认值是 36（源码 core/generic/config.hpp），
#      离 ActivationThreshold(40) 太近，滞回区间只有 4，救不回多少帧。
#      降到 20：同一份录像回放，补丁 + 36 → 47 次落指，补丁 + 20 → 39 次。
#
#      ★ /etc/iptsd.conf 注释里写的默认值 "24 / 20" 是旧版本的，别信。
#
#  ■ 对原版 iptsd 无影响
#      原版只在区域生长时用这个值；回放实测原版 36 和 20 结果完全一样（60 次）。
#      所以回滚补丁时这个文件可以留着，也可以删。
#
#  ■ ActivationThreshold 不要动
#      回放扫过 16~40：往下调断得更多（屏幕边缘常亮亮斑和手指旁瓣开始被
#      认成触点，互相抢编号），最多到 907 次落指。
# ============================================================================

[Contacts]
DeactivationThreshold = 20
