# fcitx-virtualkeyboard-adapter 配置
#
# 这个 addon 监听 fcitx5 的"输入上下文激活/失活"事件（即文本框获得/失去焦点），
# 然后执行下面的命令。fcitx5 本来就在处理 text-input-v3，所以它知道焦点变化。
#
# 这样 wvkbd 不需要去抢 zwp_input_method_v2（那是 fcitx5 自己占着的），
# 而是由 fcitx5 主动通知它显隐 —— 避开了协议冲突。
#
# ⚠ 必须用绝对路径：适配器通过 system() 执行命令，PATH 继承自 fcitx5 进程，
#   而 fcitx5 的 PATH 里没有 ~/.local/bin。
#   （实测 fcitx5 进程的 PATH 是 /usr/local/sbin:/usr/local/bin:/usr/bin:…）

# 文本框获得焦点 → 显示键盘
ActivateCmd="/usr/local/bin/wvkbd-toggle show"

# 文本框失去焦点 → 隐藏键盘
DeactivateCmd="/usr/local/bin/wvkbd-toggle hide"
