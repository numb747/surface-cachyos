# ============================================================================
#  iptsd 换成打过"粘滞极大值"补丁的版本（修单指划动断触）
#
#  编译与装法：./setup/03-iptsd-patched.sh（会打印要 sudo 的命令）
#  原理、实测数据：docs/08-触摸断触.md
#
#  ■ 为什么是 drop-in 而不是覆盖 /usr/bin/iptsd
#      覆盖的话 pacman 下次升级 iptsd 会悄悄换回原版（或者反过来被我们弄脏）。
#      drop-in 只改 ExecStart 指向 /usr/local/bin，系统包原封不动。
#
#  ■ 回滚
#      sudo rm /etc/systemd/system/iptsd@.service.d/10-patched.conf
#      sudo systemctl daemon-reload
#      sudo systemctl restart 'iptsd@dev-hidraw1.service'
#
#  ★ 上游 iptsd 升级（不再是 3.1.0）后，要重跑 03 脚本对着新版重新打补丁，
#    否则这里跑的还是旧版。doctor.sh 会检查两边版本是否一致。
# ============================================================================

[Service]
# 先清空再设置：ExecStart 是可叠加的，不清空会变成两条都跑
ExecStart=
ExecStart=/usr/local/bin/iptsd /%I
