# ============================================================================
#  iptsd 自愈补丁
#
#  装法（install.sh iptsd 模块会打印命令，要 sudo）：
#      sudo install -Dm644 systemd/etc/iptsd@.service.d/override.conf \
#           /etc/systemd/system/iptsd@.service.d/override.conf
#      sudo systemctl daemon-reload
#      sudo systemctl restart 'iptsd@dev-hidraw1.service'
#
#  ■ 为什么需要
#      软件包自带的 iptsd@.service 里是 Restart=no，且 iptsd 3.1.0 有个缺陷：
#      它用阻塞 read() 读 /dev/hidraw1，一旦被信号打断就报
#          core: linux: Reading from file failed: Interrupted system call
#      然后【直接退出】—— 没处理 EINTR 重试。2026-09-26 这次就是这么挂的。
#
#      而 50-iptsd.rules 只在 hidraw 设备【add】时才拉起 iptsd：
#          SUBSYSTEM=="hidraw", ACTION=="add", ...
#              ENV{SYSTEMD_WANTS}+="iptsd@$result.service"
#      进程自己退出后不会再有 add 事件，所以它永久躺平，触屏整个消失。
#      （注意：udevadm trigger 默认是 --action=change，【不匹配】这条规则，
#        要手动补 --action=add 才行。别在这上面浪费时间。）
#
#  ■ 这个文件做什么
#      Restart=always 让它在异常退出后自动回来。配合 RestartSec=2 避免
#      密集重试。实测这一条就能覆盖 EINTR 那种"偶发打断后死掉"的场景。
#
#  ■ 还有个更外层的前提
#      iptsd@.service 有 BindsTo=%i.device（即 dev-hidraw1.device）。
#      如果那个 device unit 是 inactive，服务一起来就会被 systemd 拆掉
#      （日志表现：Started 和 Stopped 在同一秒，且没有任何 iptsd 自己的输出）。
#      这时 Restart=always 也救不了 —— 得先让 device unit 变 active：
#          sudo udevadm trigger --action=add --subsystem-match=hidraw
#      等 device unit 显示 active (plugged) 再 start 服务。
#
#  ■ 怎么回滚
#      sudo rm /etc/systemd/system/iptsd@.service.d/override.conf
#      sudo systemctl daemon-reload
# ============================================================================

[Service]
Restart=always
RestartSec=2
