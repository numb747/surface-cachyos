[accessibility]
ui_scale = 1.20

# ── 顶部 bar：Surface 竖屏（逻辑宽只有 912）版 ─────────────────────────────
# ★ reserve_space = true：bar 常驻并占位，窗口从它下面开始排。
#   PC 版是 false + 切工作区时 bar-show/1.5 秒后 bar-hide 的 IPC 弹出，那套逻辑
#   在 mykeys.lua 里，本仓已删 —— 删了之后 bar 常显却不占位，结果就是盖住
#   浏览器的标签栏（实测：窗口 y=10 起，bar 占 0~46）。
# ★ auto_hide 仍然关：它靠"指针到顶部边缘"触发，触屏没有常驻指针，没法用。
#
# widget 取舍（PC 版 16 个 → 这里 11 个，912 宽塞不下）：
#   删 active_window  —— 和窗口自己的标题栏重复，还最占宽度
#   删 temp/sysmon×2  —— PC 的监控需求；要看点控制中心里的 System 页
#   删 media          —— 控制中心首页就有播放卡片
#   加 battery        —— 平板最该常驻的信息，PC 版没有
#   tray 改抽屉模式   —— v2rayN 等托盘图标收进一个按钮，不挤占宽度
#   session → control_center：电源菜单在控制中心右上角也有，而控制中心是
#     平板上的总入口（WiFi/蓝牙/亮度/勿扰都在里面），比电源按钮更常用
#   加 osk / rotate-lock / page-keys / lock 四个纯图标按钮（2026-09-27）——
#     平板上最常按、又没有别的一键入口的几件事，定义见文件末尾 [widget.osk] 等。
#     每个约 46px 宽，12 个 widget 在竖屏 912 宽里实测放得下。
#
# 尺寸：thickness 35 × scale 1.10 × ui_scale 1.20 ≈ 46 逻辑 px ≈ 9mm（267ppi、
#   scale 2），刚好是手指点击目标的推荐下限，别再调小。
[bar.default]
auto_hide = false
smart_auto_hide = false
reserve_space = true
start = [ "launcher", "clock" ]
center = [ "workspaces" ]
end = [ "tray", "osk", "rotate-lock", "page-keys", "notifications", "network", "battery", "volume", "lock", "control-center" ]
concave_edge_corners = true
margin_edge = 0
margin_ends = 0
radius_bottom_left = 12
radius_bottom_right = 12
radius_top_left = 0
radius_top_right = 0
scale = 1.10
thickness = 35

# pear-desktop（YouTube Music）每换一首歌就在屏幕顶部弹一次，来源不是通知，
# 是 noctalia 自己的 OSD "Now Playing"（osd-kinds-media：Show an OSD popup
# when a new track starts playing）。OSD 走 top_center，通知走 top_right，
# 别拿 [notification.filter.*] 去治它——那条路对 OSD 不生效。
# 注意这是全局开关，关的是所有播放器的换歌弹窗；noctalia 没有按播放器关 OSD
# 的选项。bar 上的 media widget 和播放控制不受影响，照常可用。
# （真要只针对单个播放器，只有 [shell.mpris] blacklist，但那会把它从 media
#   widget 里一并摘掉。）
[osd.kinds]
media = false

[shell]
clipboard_image_action_command = "satty -f -"
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true

    [shell.greeter_sync]
    auto_sync = true
    # 默认提权走 run0，它请求的是 org.freedesktop.systemd1.manage-units，
    # 绕开了包自带的 org.noctalia.greeter.apply-appearance policy，导致每次换
    # 壁纸/主题都要输密码。强制走 pkexec 才能命中
    # /etc/polkit-1/rules.d/49-noctalia-greeter.rules 里的免密规则。
    privilege_command = "pkexec"

    [shell.launcher]

        # 统一搜索里同时列出「已打开的窗口」和应用，不用先敲 /win 前缀。
        # 选中窗口回车 → hyprctl dispatch focuswindow，Hyprland 会自动跳到
        # 该窗口所在的工作区（跨显示器还会先 focusmonitor）。
        [shell.launcher.providers.windows]
        global = true

        # 很少用启动器算数，把计算器从无前缀搜索里摘出去，免得它老抢第一行。
        # 要算的时候仍然可以敲 /calc。
        [shell.launcher.providers.calculator]
        global = false

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "satty -f -"
    pipe_to_command = true
    save_to_file = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

# 剪贴板历史/日历缓存的加密主密钥来源。默认 "secret-service" 需要
# gnome-keyring/kwallet 之类的 provider，本机没有跑，导致历史只存内存、
# 重启即丢（日志：[secret-store] status=unavailable provider-unavailable）。
# 改用文件密钥后不依赖任何 keyring，也不用改 PAM。
# key_file 内容是 64 位小写十六进制（32 随机字节），权限 0600。
# ★ 这个文件别弄丢：换掉密钥不会重新加密，只会让旧历史读不出来
#   （文件本身不会被删，换回原密钥即可恢复）。
[storage]
key_source = "file"
key_file = "/home/charlen/.config/noctalia/storage.key"

[system.monitor]
gpu_poll_seconds = 2

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "alacritty" ]

[widget.clock]
color = "secondary"
# 只留时间+月日；星期/年份点一下时钟看日历
format = "{:%H:%M  %m/%d}"

[widget.launcher]
color = "secondary"

[widget.network]
color = "secondary"

[widget.notifications]
color = "secondary"
hide_when_no_unread = true

[widget.tray]
capsule = true
capsule_fill = "on_secondary"
drawer = true

[widget.battery]
color = "secondary"
label_content = "percent"

[widget.control-center]
color = "secondary"

[widget.volume]
color = "secondary"

[widget.workspaces]
active_pill_size = 2.5
capsule = true
capsule_fill = "on_primary"
inactive_pill_size = 1.0
pill_scale = 0.80
show_labels = false

# ── 平板快捷按钮（custom_button）───────────────────────────────────────────
# 动作写 /usr/local/bin 的绝对路径：noctalia 的 PATH 里没有 ~/.local/bin（docs/07）。
# 右键都给了"次要动作"，手指长按在 noctalia 里等于右键。

# 虚拟键盘：点 = 显示/隐藏。PC 模式下 wvkbd-toggle 自己不弹（docs/03）。
[widget.osk]
type = "custom_button"
glyph = "keyboard"
tooltip = "虚拟键盘"
color = "secondary"

    [widget.osk.actions]
    left = "exec /usr/local/bin/wvkbd-toggle"
    right = "exec /usr/local/bin/wvkbd-toggle hide"

# 旋转锁：点 = 锁定/解锁自动旋转（躺着看视频/小说）。PC 模式固定横屏，点了只提示。
[widget.rotate-lock]
type = "custom_button"
glyph = "rotate"
tooltip = "锁定 / 解锁自动旋转"
color = "secondary"

    [widget.rotate-lock.actions]
    left = "exec /usr/local/bin/surface-ctl rotate-lock"

# 翻页键：点 = 侧边音量键 ⇄ 翻页键（音量− 下一页，音量+ 上一页），再点切回。
# 切完弹通知说明当前是哪种（图标是静态的，看不出状态）。
# ★ 早先挂在旋转锁按钮的长按上，长按在触屏上不好按准，改成单独按钮点击切换。
[widget.page-keys]
type = "custom_button"
glyph = "book"
tooltip = "侧边音量键 ⇄ 翻页键"
color = "secondary"

    [widget.page-keys.actions]
    left = "exec /usr/local/bin/surface-ctl page-keys"

# 锁屏：平板模式下锁屏上会自动弹出虚拟键盘（见下面 [hooks]）。
# 长按 = 电源菜单（关机/重启/注销）。
[widget.lock]
type = "custom_button"
glyph = "lock"
tooltip = "锁屏 · 长按：电源菜单"
color = "secondary"

    [widget.lock.actions]
    left = "session lock"
    right = "panel-toggle session"

# ── 事件 hook ──────────────────────────────────────────────────────────────
# 锁屏后在平板模式下弹出虚拟键盘（wvkbd 有 above_lock 规则，画在锁屏之上，
# 见 mykeys.lua §4）；解锁后收起。
# 两个 hook 顺带维护锁屏标记，mykeys.lua §7 的音量键靠它判断锁着时不翻页。
[hooks]
session_locked = "/usr/local/bin/surface-ctl on-lock"
session_unlocked = "/usr/local/bin/surface-ctl on-unlock"

# ── 空闲 ───────────────────────────────────────────────────────────────────
# 只做"熄屏"，不自动锁屏：锁屏后要输密码，平板上不值得（手动锁屏走顶栏按钮）。
# 熄屏也跳过正在出声的时候：Firefox 放视频不申请防熄屏，一动不动看长视频会被熄
# （surface-ctl idle-screen-off 查 pactl 里有没有未暂停的流）。
# 碰一下屏幕就亮：resume_command 把显示器打开。
[idle.behavior.screen-off]
timeout = 300
action = "command"
command = "/usr/local/bin/surface-ctl idle-screen-off"
resume_command = "noctalia msg dpms-on"
enabled = true
